name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          modules: 'qtgraphs'
          cache: true

      - name: Install Qt MQTT module
        run: |
          if [ ! -d "$QT_ROOT_DIR/lib/cmake/Qt6Mqtt" ]; then
            git clone --depth 1 --branch 6.10 https://github.com/qt/qtmqtt.git
            cmake -S qtmqtt -B qtmqtt/build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
              -DCMAKE_INSTALL_PREFIX="$QT_ROOT_DIR" \
              -DQT_BUILD_TESTS=OFF \
              -DQT_BUILD_EXAMPLES=OFF
            cmake --build qtmqtt/build --parallel
            cmake --install qtmqtt/build
          fi

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build tests
        run: cmake --build build --target tst_alarmrule tst_alarmmanager tst_appsettings tst_mqttparsing --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
